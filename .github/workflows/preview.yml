name: Cloudflare Pages PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: cloudflare-pages-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy PR Preview to Cloudflare Pages
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    steps:
      - name: Check Cloudflare Pages credentials
        id: cf_check
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ Cloudflare Pages secrets (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) are not configured. Skipping PR preview deployment."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cf_check.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.cf_check.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        if: steps.cf_check.outputs.configured == 'true'
        run: npm ci

      - name: Build with Vite
        if: steps.cf_check.outputs.configured == 'true'
        run: npm run build
        env:
          VITE_STRAPI_API_URL: ${{ vars.VITE_STRAPI_API_URL }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf_check.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'faizan-e-madina-website' }} --branch=pr-${{ github.event.pull_request.number }}

      - name: Post or update sticky preview comment
        if: steps.cf_check.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOY_OUTPUT: ${{ steps.deploy.outputs.command-output }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' | tail -n 1 || echo "")
          MARKER="<!-- cloudflare-pages-preview -->"

          if [ -n "$PREVIEW_URL" ]; then
            BODY="${MARKER}"$'\n'"### Cloudflare Pages PR Preview"$'\n\n'"- **Preview URL:** ${PREVIEW_URL}"$'\n'"- **Commit:** \`${HEAD_SHA:0:7}\`"
          else
            BODY="${MARKER}"$'\n'"### Cloudflare Pages PR Preview"$'\n\n'"Deployment completed for commit \`${HEAD_SHA:0:7}\`. Check the workflow run logs for the preview URL."
          fi

          EXISTING_ID=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- cloudflare-pages-preview -->"))) | .id' \
            | tail -n 1)

          if [ -n "$EXISTING_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/${EXISTING_ID}" -f body="$BODY"
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -f body="$BODY"
          fi
